<html><head><script id="__NEXT_DATA__" type="application/json">{"props": {"pageProps": {"initialState": {"jobs": {"currentJob": {"applicationMethod": "method_not_defined", "applicationPath": null, "compensationCurrency": "CAD", "compensationPeriod": "year", "compensationAmountMinCents": 15730000, "compensationAmountMaxCents": 21280000, "compensationOffersEquity": false, "compensationPublic": true, "description": "<p>Clio is the global leader in legal AI technology, empowering legal professionals and law firms of every size to work smarter, faster, and more securely. </p><p></p><p>We are transforming the legal experience for all by <a target=\"_blank\" href=\"https://www.clio.com/customers/\">bettering the lives of legal professionals </a>while <a target=\"_blank\" href=\"https://www.clio.com/customers/california-innocence-project-changes-lives-clio/\">increasing access to justice</a>.</p><p></p><h1><b>Summary:</b></h1><h1></h1><p>We are currently seeking a <b>Senior Data Engineer</b> to join our rapidly growing engineering team. This role is for someone who is passionate about building innovative data solutions and being exposed to new challenges and technologies while making an impact. </p><br><p>This role is available to candidates across Eastern Canada in the Eastern or Atlantic time zones, excluding Quebec. If you are local to Toronto, then you will be expected to be in office twice per week on days of your choice. If you are not local to Toronto, then you may work remotely across Canada, but our offices are open to you if you would like to visit.</p><br><h2>What your team does:</h2><p>Our data engineering team is driven to deliver an incredible experience to our customers. As a Senior Data Engineer at Clio, you will build data pipelines and data warehouses from scratch, as well as make data sets accessible to our partner teams by writing great production code. We move quickly, work with new state of the art technologies, and are motivated by solving complex problems.</p><br><h2>A day in the life might look like:</h2><ul> <li>Implement data ingestion techniques (streaming and batch) using best practices in data modeling, ETL/ELT processes by leveraging AWS technologies and data tools</li> <li>Design, build, and maintain data transformation pipelines consolidating various data sources (streaming or batch) into specific data lakes/data warehouses</li> <li>Collaborate with engineers to help adopt best practices in data system creation, data integrity, test design, analysis, validation, and documentation</li> <li>Develop prototype or \"proof of concept\" implementations of projects where the technical solution is unknown or unproven</li> </ul><br><h2>What you may have:</h2><ul> <li>Deep experience in software development as well as data engineering</li> <li>Proficiency in at least one major language (e.g. Python, Scala, Ruby) and SQL, striving to write elegant and maintainable code, and comfortability with picking up new technologies</li> <li>Hands-on experience with cloud infrastructure (AWS and Terraform are preferred)</li> <li>Experience with streaming and batch data tools: Spark, Kafka, Airflow</li> <li>Advanced data warehousing experience working with Databricks or similar</li> <li>Experience building data pipelines and the infrastructure required to deploy data models and dashboards that allow data visualization</li> <li>Exceptional collaboration and communication skills and ability to derive clarity in ambiguous environments</li> <li>You are an advocate for the data trustworthiness and product excellence of the data platform you build</li> <li>You have an interest in improving your craft by using AI</li> <li>You are a self-starter and can lead projects with minimum supervision</li> <li>You enjoy mentoring junior engineers and are invested in their growth </li> </ul><br><p>This posting is for an existing vacancy.</p><br><p><b>What you will find here:</b></p><p></p><p>Compensation is one of the main components of Clio\u2019s Total Rewards Program. We have developed a series of programs and processes to ensure we are creating fair and competitive pay practices that form the foundation of our human and high-performing culture.<br> </p><p><b>Some highlights of our Total Rewards program include: </b></p><ul> <li><p><span><span>Competitive, equitable salary with top-tier health benefits, dental, and vision insurance </span></span></p></li> <li><p><span><span>Hybrid work environment, with expectation for local Clions (Vancouver, Calgary, Toronto, Dublin, London, New York City and Sydney) to be in office min. twice per week. </span></span></p></li> <li><p><span><span>Flexible time off policy, with an encouraged 20 days off per year.</span></span></p></li> <li><p><span><span>$2000 annual counseling benefit</span></span></p></li> <li><p><span><span>RRSP matching and RESP contribution </span></span></p></li> <li><p><span><span>Clioversary recognition program with special acknowledgement at 3, 5, 7, and 10 years</span></span></p></li> </ul><p></p>The expected salary range for this role is $157,300 to $212,800 CAD. Initial placement within the range is informed by geographic region, experience, and skillset, with room to progress as impact and tenure grow. Final offer amounts will vary based on candidate profile.<p></p><p><b>Diversity, Inclusion, Belonging and Equity (DIBE) &amp; Accessibility </b></p><p>Our team shows up as their authentic selves, and are united by our mission. We are dedicated to<a target=\"_blank\" href=\"https://www.clio.com/about/values/\"> diversity, equity and inclusion</a>. We pride ourselves in building and fostering an environment where our teams feel included, valued, and enabled to do the best work of their careers, wherever they choose to log in from. We believe that different perspectives, skills, backgrounds, and experiences result in higher-performing teams and better innovation. We are committed to equal employment and we encourage candidates from all backgrounds to apply.</p><p></p><p>Clio provides accessibility accommodations during the recruitment process. Should you require any accommodation, please let us know and we will work with you to meet your needs.</p><p></p><p>Learn more about our culture at<a target=\"_blank\" href=\"https://www.clio.com/about/careers/\"><span><span><span><span><span><span><span><span><span><span><span><span><span><span><span> clio.com/careers</span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></a></p><p>We're a Human and High Performing AI company, meaning we use artificial intelligence to improve all of our operations. In recruitment, AI helps us streamline the process for greater efficiency. However, we've built our systems to ensure that a human always reviews AI-generated output, and we never make automated hiring decisions.</p><p></p><p><i><b>Disclaimer: </b>We only communicate with candidates through official @clio.com email addresses.</i></p>", "descriptionLastUpdatedAt": "2026-10-09T10:24:54.354Z", "employmentTypes": ["full_time"], "expiresAt": null, "id": 96377579, "locations": [{"id": 12, "name": "Canada", "placeId": "ChIJ2WrMN9MDDUsRpY9Doiq3aJk", "description": "Canada"}, {"id": 276, "name": "Toronto, ON, Canada", "placeId": "ChIJpTvG15DL1IkRd8S0KlBVNTI", "description": "Toronto, ON, Canada"}, {"id": 1425, "name": "Remote", "placeId": "remote", "description": "Remote"}], "organization": {"id": 10603, "domain": "clio.com", "name": "Clio", "logoUrl": "https://cdn.getro.com/companies/b6f34c13-9386-5685-b548-96a0dbca9adc-1746495382", "slug": "clio", "jobBoardCollectionsCount": 11, "pmktpEnabled": false, "approxEmployees": 1873, "description": "Clio is a suite of web-based tools that help law firms in practice management and client collaboration. Clio is a suite of online tools designed to manage a law firm. Completely web-based, Clio is a practice management system that is specifically designed for solo practitioners and small law
